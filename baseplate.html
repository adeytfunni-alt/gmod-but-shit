<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMod Prototype - Baseplate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Center Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Let clicks pass through */
            z-index: 2;
        }

        /* Instructions Overlay */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 3;
            transition: opacity 0.5s;
        }

        #instructions {
            text-align: center;
            cursor: pointer;
        }

        h1 { font-size: 3em; margin-bottom: 0px; }
        p { font-size: 1.2em; }
        .key {
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            border-bottom: 2px solid #222;
        }
    </style>
</head>
<body>

    <!-- UI Elements -->
    <div id="crosshair"></div>
    
    <div id="blocker">
        <div id="instructions">
            <h1>CLICK TO PLAY</h1>
            <p>Move: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> (Hold <span class="key">Shift</span> to Sprint)</p>
            <p>Look: Mouse</p>
            <p style="font-size: 0.8em; opacity: 0.7;">(Press ESC to release cursor)</p>
        </div>
    </div>

    <!-- 3D Container -->
    <div id="canvas-container"></div>

    <!-- Import Three.js from a CDN (ES Modules) -->
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';

        // --- GLOBAL VARIABLES ---
        let camera, scene, renderer;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Player settings
        const walkSpeed = 80.0; 
        const sprintSpeed = 200.0; // Much faster!
        let isSprinting = false;
        const playerHeight = 2.5; // Height of eyes off the ground
        
        // Map Size (Half size, from center)
        const mapLimit = 250; 

        // --- POINTER LOCK CONTROLS LOGIC (Custom Implementation) ---
        const controls = {
            enabled: false,
            getObject: function() { return camera; },
            onMouseMove: function(event) {
                if (controls.enabled === false) return;

                const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

                const sensitivity = 0.002;
                
                // Rotate camera on Y (Look Left/Right)
                camera.rotation.y -= movementX * sensitivity;
                
                // Rotate camera on X (Look Up/Down)
                camera.rotation.x -= movementY * sensitivity;

                // Clamp looking up/down
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        };

        // --- INITIALIZATION ---
        init();
        animate();

        function init() {
            // 1. Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

            // 2. Setup Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = "YXZ"; 
            
            // 3. Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Setup Lighting
            const ambientLight = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            ambientLight.position.set(0.5, 1, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 5. Build The "Baseplate"
            createEnvironment();

            // 6. Setup Inputs
            setupInteraction();
            
            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment() {
            // -- The Floor (Grid) --
            // 500x500 Grid
            const planeGeometry = new THREE.PlaneGeometry(mapLimit * 2, mapLimit * 2);
            planeGeometry.rotateX(-Math.PI / 2); 
            
            const planeMaterial = new THREE.MeshLambertMaterial({ color: 0xdddddd });
            const floor = new THREE.Mesh(planeGeometry, planeMaterial);
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(mapLimit * 2, 100); 
            gridHelper.position.y = 0.01; 
            gridHelper.material.opacity = 0.25;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // -- Uniform Reference Cubes --
            // Placing 5 cubes in a Cross (+) pattern
            const boxGeo = new THREE.BoxGeometry(4, 4, 4); // Slightly bigger cubes
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });

            // Coordinates for uniform placement (Center, North, South, East, West)
            const positions = [
                { x: 0, z: 0 },       // Center
                { x: 0, z: -80 },     // Forward (North)
                { x: 0, z: 80 },      // Backward (South)
                { x: -80, z: 0 },     // Left (West)
                { x: 80, z: 0 }       // Right (East)
            ];

            positions.forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(pos.x, 2, pos.z); // y=2 so it sits on floor (height is 4)
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
            });
        }

        function setupInteraction() {
            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () {
                controls.enabled = true;
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', function () {
                if (document.pointerLockElement === document.body) {
                    controls.enabled = true;
                    blocker.style.display = 'none';
                } else {
                    controls.enabled = false;
                    blocker.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', controls.onMouseMove);

            // MOVEMENT KEYS
            document.addEventListener('keydown', function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = true;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = true;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = true;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = true;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        isSprinting = true;
                        break;
                }
            });

            document.addEventListener('keyup', function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = false;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = false;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = false;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = false;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        isSprinting = false;
                        break;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            
            if (controls.enabled === true) {
                const delta = (time - prevTime) / 1000;

                // Drag / Friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                // Determine direction
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); 

                const currentSpeed = isSprinting ? sprintSpeed : walkSpeed;

                if (moveForward || moveBackward) velocity.z -= direction.z * currentSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * currentSpeed * delta;

                // Move Camera
                camera.translateX(-velocity.x * delta);
                // In local space, positive Z is backward. 
                camera.translateZ(velocity.z * delta); 
                
                // Force Height
                camera.position.y = playerHeight;

                // -- INVISIBLE WALLS (Forcefield) --
                // Prevent camera from going beyond mapLimit (-250 to 250)
                // We check X and Z world positions
                if (camera.position.x < -mapLimit) camera.position.x = -mapLimit;
                if (camera.position.x > mapLimit) camera.position.x = mapLimit;
                if (camera.position.z < -mapLimit) camera.position.z = -mapLimit;
                if (camera.position.z > mapLimit) camera.position.z = mapLimit;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
